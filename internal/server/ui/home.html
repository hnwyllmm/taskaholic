<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页 · Work Assistant</title><link rel="stylesheet" href="/assets/shell.css"><script src="/assets/shared.js" defer></script><script src="/assets/review-chat.js" defer></script><script src="/assets/home.js" defer></script></head>
<body class="app-page" data-page="home"><header data-app-shell></header><div id="notice" role="status" aria-live="polite" hidden></div>
<main><div class="page-heading"><div><span class="eyebrow">A LITTLE LESS TO MANAGE</span><h1>让工作向前，把决定留给你。</h1><p id="home-summary">正在读取你的工作进展…</p></div><span class="home-date" id="today"></span></div>
<div class="home-grid"><section class="home-inbox"><div class="section-heading"><h2>需要你看一下 <span id="attention-count" class="attention-count">—</span></h2><a href="/tasks">全部工作 →</a></div><div id="inbox" class="inbox-list"><p class="muted small">读取待办中…</p></div></section>
<section class="home-chat" aria-label="首页助理对话"><div class="chat-top"><h2>和工作助理聊聊</h2><button id="new-chat">＋ 新对话</button></div><div class="chat-history"><label class="sr" for="chat-select">历史对话</label><select id="chat-select"><option value="">新的对话</option></select></div><div class="chat-thread" id="chat-thread" role="log" aria-label="对话记录"></div><div id="generating" class="generating" role="status" hidden>正在理解你的消息… 可离开页面，回复会保存在这里。</div><form id="chat-form" class="chat-composer"><label class="sr" for="home-message">告诉助理你想做什么</label><textarea id="home-message" rows="3" maxlength="5000" placeholder="问问进度，交代一件事，或一起想想下一步…"></textarea><div class="composer-bottom"><span class="hint">先讨论，再确认行动。聊天不会自动批准验收。</span><button type="button" id="stop-chat" hidden>停止回答</button><button class="primary" type="submit" id="send-chat">发送 ↗</button></div></form></section>
<aside class="home-rail"><section class="quiet-status"><h2>系统正在怎样运行</h2><div class="health-line"><span id="health-dot" class="health-dot"></span><span id="system-health">读取状态中…</span></div><p id="system-hint"></p><a href="/system">查看运行详情 →</a></section><section class="evolution"><div class="section-heading"><h2>系统进化</h2><span class="evolution-stage" id="upgrade-stage"></span></div><div id="upgrade-card"><p class="small muted">读取升级状态中…</p></div></section><section><div class="section-heading"><h2>最近的进展</h2></div><div id="recent" class="recent-list"></div><p class="home-note">日常协作回到同一个 Agent 与 Session。你的决定和交付物都留有记录。</p></section></aside></div><p class="page-footer">普通工作保持只读分析与文本交付；系统升级只在两次人工确认后切换候选版本。</p></main>
<dialog id="decision-dialog" class="decision-dialog" aria-labelledby="decision-title"><div class="dialog-heading"><div><span id="decision-kind" class="eyebrow"></span><h2 id="decision-title"></h2><span id="decision-version" class="muted small"></span></div><button id="close-decision">关闭</button></div><div id="decision-message" class="dialog-message prewrap"></div><section id="decision-files"><label class="sr" for="decision-artifact">本次交付文件</label><select id="decision-artifact"></select><pre id="decision-preview"></pre></section><label for="decision-comment" id="decision-label">你的意见<textarea id="decision-comment" rows="3" placeholder="告诉 Agent 哪些地方需要调整…"></textarea></label><p class="small muted" id="decision-hint"></p><div class="dialog-actions"><a id="decision-link" href="/tasks">完整工作记录 →</a><button id="decision-download">下载文件</button><button id="decision-reject">要求修改</button><button id="decision-approve" class="primary">通过本次验收</button><button id="decision-reply" class="primary">发送给原 Agent</button></div><div id="decision-error" class="dialog-error" role="alert" hidden></div></dialog>
</body></html>
